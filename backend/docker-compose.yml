services:
  postgres:
    image: postgres:16-alpine
    container_name: condogest-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-condogest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-condogest}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-condogest}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: condogest-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: condogest-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  core-service:
    build:
      context: ./core-service
      dockerfile: Dockerfile
    container_name: condogest-core
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-condogest}:${POSTGRES_PASSWORD:-condogest}@postgres:5432/condogest_core
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-changeme}
      SEED_DB: ${SEED_DB:-false}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ticket-service:
    build:
      context: ./ticket-service
      dockerfile: Dockerfile
    container_name: condogest-ticket
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-condogest}:${POSTGRES_PASSWORD:-condogest}@postgres:5432/condogest_tickets
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-changeme}
      SEED_DB: ${SEED_DB:-false}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # notification-service:
  #   build:
  #     context: ./notification-service
  #     dockerfile: Dockerfile
  #   container_name: condogest-notification
  #   environment:
  #     NODE_ENV: production
  #     PORT: 3002
