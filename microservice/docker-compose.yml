version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: condogest-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: condogest
    ports:
      - "5433:5432"
    volumes:
      - condogest_data:/var/lib/postgresql/data

volumes:
  condogest_data: